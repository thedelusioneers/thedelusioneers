<!--
  THE DELUSIONEERS — STANDARD SITE HEADER
  Reusable component. Drop the CSS into <style>, the HTML into <body> before content,
  and the JS into <script>. Requires JetBrains Mono + Special Elite already loaded.
  Dark mode toggle expects data-theme on <html> element.
-->

<!-- ============================================================
     CSS — add to <style> block
     ============================================================ -->
<style id="header-component-styles">
  .site-header {
    width: var(--doc-width, min(680px, 92vw));
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 12px;
    margin-bottom: 12px;
  }

  .site-header-left a {
    font-family: 'Special Elite', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f5f0e8;
    text-decoration: none;
    opacity: 0.85;
    transition: opacity 0.2s;
  }
  .site-header-left a:hover { opacity: 1; }

  .site-header-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Social links */
  .header-social {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-right: 10px;
  }

  .header-social-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(245,240,232,0.45);
    text-decoration: none;
    padding: 4px 8px;
    border: 1px solid rgba(245,240,232,0.12);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .header-social-link:hover {
    color: rgba(245,240,232,0.85);
    border-color: rgba(245,240,232,0.3);
  }

  /* Icon links — flex row, icon + label */
  .header-social-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 4px 8px;
  }
  .header-social-icon svg {
    display: block;
    flex-shrink: 0;
  }
  .header-social-icon .icon-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .header-social-divider {
    width: 1px;
    height: 12px;
    background: rgba(245,240,232,0.12);
    margin: 0 2px;
  }

  /* Theme toggle */
  .theme-toggle {
    background: transparent;
    border: 1px solid rgba(245,240,232,0.12);
    color: rgba(245,240,232,0.45);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
  }
  .theme-toggle:hover {
    color: rgba(245,240,232,0.85);
    border-color: rgba(245,240,232,0.3);
  }

  @media (max-width: 480px) {
    .site-header-left a { font-size: 11px; letter-spacing: 2px; }
    .header-social-link { font-size: 7.5px; padding: 3px 6px; }
    .header-social-icon .icon-label { font-size: 7.5px; }
    .theme-toggle { font-size: 7.5px; padding: 3px 7px; }
  }
</style>

<!-- ============================================================
     JS — place in <script> before </body>
     Remove any existing theme toggle script when retrofitting.
     ============================================================ -->
<script id="header-component-script">
  const html = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const icon = document.getElementById('toggleIcon');
  const label = document.getElementById('toggleLabel');

  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
  const saved = localStorage.getItem('delusioneers-theme');
  const initialDark = saved ? saved === 'dark' : prefersDark.matches;

  function setTheme(dark) {
    html.setAttribute('data-theme', dark ? 'dark' : 'light');
    icon.textContent = dark ? '●' : '○';
    label.textContent = dark ? 'Dark' : 'Light';
  }

  setTheme(initialDark);

  toggle.addEventListener('click', () => {
    const isDark = html.getAttribute('data-theme') === 'dark';
    setTheme(!isDark);
    localStorage.setItem('delusioneers-theme', !isDark ? 'dark' : 'light');
  });

  prefersDark.addEventListener('change', (e) => {
    if (!localStorage.getItem('delusioneers-theme')) setTheme(e.matches);
  });
</script>
