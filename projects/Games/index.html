<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mycelio — conduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --substrate:#07090c; --hypha:#26e0c8; --hypha-dim:#173f39;
    --spike:#ffc24b; --spike-hot:#fff2d0; --root:#7af0c0;
    --ink:#e8f2ec; --muted:#7c8f88; --hair:rgba(120,150,142,0.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--substrate);overflow:hidden}
  body{font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;touch-action:none;user-select:none}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .panel{position:absolute;pointer-events:auto}
  .bracket{position:absolute;width:24px;height:24px;border:1px solid var(--hair)}
  .bracket.tl{top:18px;left:18px;border-right:0;border-bottom:0}
  .bracket.tr{top:18px;right:18px;border-left:0;border-bottom:0}
  .bracket.bl{bottom:18px;left:18px;border-right:0;border-top:0}
  .bracket.br{bottom:18px;right:18px;border-left:0;border-top:0}

  .id{top:28px;left:34px}
  .id .eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--muted)}
  .id h1{font-weight:500;font-size:27px;letter-spacing:-.01em;line-height:1;margin-top:8px;
    display:flex;align-items:center;gap:10px}
  .id .mark{color:var(--hypha)}

  .reads{top:28px;right:34px;text-align:right;display:flex;flex-direction:column;gap:13px}
  .read .k{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted)}
  .read .v{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:500;color:var(--ink);
    line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
  .read .v small{font-size:11px;color:var(--muted);margin-left:2px}
  .read.win .v{color:var(--hypha)}

  .console{left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:13px;width:max-content;max-width:92vw}
  .hint{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.03em;color:var(--muted);text-align:center}
  .hint b{color:var(--hypha);font-weight:500}
  .controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  button{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink);background:rgba(11,20,17,.66);border:1px solid var(--hair);padding:9px 15px;
    border-radius:2px;cursor:pointer;backdrop-filter:blur(7px);transition:border-color .18s,color .18s,background .18s}
  button:hover{border-color:var(--hypha);color:var(--hypha)}
  button:focus-visible{outline:2px solid var(--hypha);outline-offset:2px}

  /* win overlay */
  #win{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 46%,rgba(8,22,18,.55),rgba(7,9,12,.86));backdrop-filter:blur(2px)}
  #win.show{display:flex;animation:fade .6s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #win .card{text-align:center;pointer-events:auto}
  #win .eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--hypha)}
  #win h2{font-weight:500;font-size:38px;letter-spacing:-.01em;margin:12px 0 8px}
  #win p{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);margin-bottom:24px}
  #win .controls{justify-content:center}

  #boot{position:fixed;inset:0;background:var(--substrate);z-index:30;display:flex;align-items:center;
    justify-content:center;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.3em;
    color:var(--muted);transition:opacity .7s ease;text-transform:uppercase}
  #boot.gone{opacity:0;pointer-events:none}

  @media (max-width:640px){
    .id{top:22px;left:22px}.id h1{font-size:22px}
    .reads{top:auto;bottom:96px;left:0;right:0;flex-direction:row;justify-content:space-around;text-align:center;gap:0;padding:0 10px}
    .read .v{font-size:14px}.read .k{font-size:7.5px;letter-spacing:.1em}
    .console{bottom:20px}.bracket{width:16px;height:16px}
    #win h2{font-size:28px}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="hud">
  <span class="bracket tl"></span><span class="bracket tr"></span>
  <span class="bracket bl"></span><span class="bracket br"></span>

  <div class="panel id">
    <div class="eyebrow">Conduction puzzle</div>
    <h1><span class="mark">⌁</span> Mycelio</h1>
  </div>

  <div class="panel reads">
    <div class="read"><div class="k">Level</div><div class="v" id="rLvl">1</div></div>
    <div class="read"><div class="k">Moves</div><div class="v" id="rMov">0</div></div>
    <div class="read"><div class="k">Receptors</div><div class="v" id="rRec">0<small>/0</small></div></div>
    <div class="read" id="readOpen"><div class="k">Open ends</div><div class="v" id="rOpen">0</div></div>
  </div>

  <div class="panel console">
    <div class="hint">Tap a strand to rotate it · feed every <b>receptor</b> from the root, close all open ends</div>
    <div class="controls">
      <button id="bNew">New puzzle</button>
      <button id="bSolveHint">Shuffle</button>
    </div>
  </div>
</div>

<div id="win">
  <div class="card">
    <div class="eyebrow">Conduction complete</div>
    <h2>Substrate online</h2>
    <p id="winSub">level 1 · 0 moves</p>
    <div class="controls">
      <button id="bNext">Next substrate →</button>
      <button id="bReplay">Replay</button>
    </div>
  </div>
</div>

<div id="boot">culturing substrate</div>

<script>
(() => {
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  // directions as bitmask
  const N=1,E=2,S=4,Wd=8;
  const DIRS=[N,E,S,Wd];
  const DV={[N]:[0,-1],[E]:[1,0],[S]:[0,1],[Wd]:[-1,0]};
  const OPP={[N]:S,[E]:Wd,[S]:N,[Wd]:E};
  const rotCW=m=>{let r=0; if(m&N)r|=E; if(m&E)r|=S; if(m&S)r|=Wd; if(m&Wd)r|=N; return r;};
  const popcount=m=>((m&1)+((m>>1)&1)+((m>>2)&1)+((m>>3)&1));

  let W=0,H=0,DPR=1;
  let R=4,C=4, cells=[], root=0, cell=60, ox=0, oy=0;
  let level=1, moves=0, won=false, winT=0;

  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }
  function layout(){
    const padTop = W<=640?150:130, padBot = W<=640?150:120, padX=46;
    const availW=W-padX*2, availH=H-padTop-padBot;
    cell=Math.max(34, Math.floor(Math.min(availW/C, availH/R)));
    const bw=cell*C, bh=cell*R;
    ox=(W-bw)/2; oy=padTop+(availH-bh)/2;
  }
  addEventListener('resize',resize);

  function idx(c,r){return r*C+c;}
  function inb(c,r){return c>=0&&c<C&&r>=0&&r<R;}
  function neighbor(i,d){
    const c=i%C, r=(i/C)|0, v=DV[d];
    const nc=c+v[0], nr=r+v[1];
    return inb(nc,nr)?idx(nc,nr):-1;
  }

  // ---- generate a solvable puzzle: random spanning tree, then scramble rotations ----
  function genLevel(){
    R = 4 + Math.floor((level-1)/2); if(R>7)R=7;
    C = R + ((level-1)%2);           if(C>7)C=7;
    layout();
    const total=R*C;
    cells = Array.from({length:total},()=>({mask:0,draw:0,powered:false,depth:0,bloom:0}));
    // recursive backtracker spanning tree
    root = idx((C/2)|0,(R/2)|0);
    const seen=new Array(total).fill(false);
    const stack=[root]; seen[root]=true;
    while(stack.length){
      const cur=stack[stack.length-1];
      const opts=[];
      for(const d of DIRS){ const nb=neighbor(cur,d); if(nb>=0&&!seen[nb]) opts.push([d,nb]); }
      if(!opts.length){ stack.pop(); continue; }
      const [d,nb]=opts[(Math.random()*opts.length)|0];
      cells[cur].mask|=d; cells[nb].mask|=OPP[d];
      seen[nb]=true; stack.push(nb);
    }
    // receptors = leaves (single connection), excluding root
    for(let i=0;i<total;i++) cells[i].isReceptor = (popcount(cells[i].mask)===1 && i!==root);
    cells[root].isRoot=true;
    // scramble
    do{
      for(let i=0;i<total;i++){
        const t=(Math.random()*4)|0;
        for(let k=0;k<t;k++) cells[i].mask=rotCW(cells[i].mask);
      }
    } while(openEnds()===0); // never start solved
    moves=0; won=false; winT=0;
    document.getElementById('win').classList.remove('show');
    refresh();
  }

  function connected(i,d){
    const nb=neighbor(i,d);
    return nb>=0 && (cells[i].mask&d) && (cells[nb].mask&OPP[d]);
  }
  function openEnds(){
    let open=0;
    for(let i=0;i<cells.length;i++)
      for(const d of DIRS) if(cells[i].mask&d){ if(!connected(i,d)) open++; }
    return open;
  }
  function computePower(){
    for(const c of cells){c.powered=false;c.depth=0;}
    const q=[root]; cells[root].powered=true; cells[root].depth=0;
    while(q.length){
      const cur=q.shift();
      for(const d of DIRS){
        if(connected(cur,d)){
          const nb=neighbor(cur,d);
          if(!cells[nb].powered){cells[nb].powered=true;cells[nb].depth=cells[cur].depth+1;q.push(nb);}
        }
      }
    }
  }

  // ---- readout refresh + win check ----
  const el={lvl:rId('rLvl'),mov:rId('rMov'),rec:rId('rRec'),open:rId('rOpen'),readOpen:rId('readOpen')};
  function rId(x){return document.getElementById(x);}
  function refresh(){
    computePower();
    const open=openEnds();
    let recTot=0,recLit=0;
    for(const c of cells) if(c.isReceptor){recTot++; if(c.powered)recLit++;}
    el.lvl.textContent=level;
    el.mov.textContent=moves;
    el.rec.innerHTML=recLit+'<small>/'+recTot+'</small>';
    el.open.textContent=open;
    el.readOpen.classList.toggle('win',open===0);
    if(open===0 && !won && moves>0){ triggerWin(); }
  }

  function triggerWin(){
    won=true; winT=0;
    for(const c of cells) c.bloom=Math.max(c.bloom,0.001);
    setTimeout(()=>{
      rId('winSub').textContent='level '+level+' · '+moves+(moves===1?' move':' moves');
      document.getElementById('win').classList.add('show');
    }, reduce?200:1100);
  }

  // ---- input ----
  function hitCell(px,py){
    const c=Math.floor((px-ox)/cell), r=Math.floor((py-oy)/cell);
    if(!inb(c,r)) return -1;
    return idx(c,r);
  }
  cv.addEventListener('pointerdown',e=>{
    if(won) return;
    const i=hitCell(e.clientX,e.clientY);
    if(i<0||cells[i].mask===0) return;
    cells[i].mask=rotCW(cells[i].mask);
    cells[i].draw=reduce?0:-Math.PI/2; // animate spin into place
    moves++;
    refresh();
  });

  document.getElementById('bNew').addEventListener('click',()=>genLevel());
  document.getElementById('bSolveHint').addEventListener('click',()=>{
    // re-scramble current board (same level)
    do{ for(let i=0;i<cells.length;i++){const t=(Math.random()*4)|0;for(let k=0;k<t;k++)cells[i].mask=rotCW(cells[i].mask);} }
    while(openEnds()===0);
    moves=0;won=false;document.getElementById('win').classList.remove('show');refresh();
  });
  document.getElementById('bNext').addEventListener('click',()=>{level++;genLevel();});
  document.getElementById('bReplay').addEventListener('click',()=>{genLevel();});

  // ---- render ----
  let last=0,t=0;
  function frame(ts){
    if(!last)last=ts; const dt=Math.min(ts-last,50); last=ts; t+=dt;
    if(won)winT+=dt;

    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#07090c';ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(W/2,oy+R*cell/2,30,W/2,oy+R*cell/2,Math.max(W,H)*0.6);
    g.addColorStop(0,'rgba(16,34,30,0.5)');g.addColorStop(1,'rgba(7,9,12,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    const half=cell/2, arm=Math.max(2.4,cell*0.062);

    // edges/flow pass (additive)
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    for(let i=0;i<cells.length;i++){
      const c=cells[i]; if(c.mask===0) continue;
      c.draw += (0-c.draw)*0.22;
      const cx=ox+(i%C)*cell+half, cy=oy+((i/C)|0)*cell+half;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(c.draw);
      for(const d of DIRS){
        if(!(c.mask&d))continue;
        const v=DV[d], ex=v[0]*half, ey=v[1]*half;
        const lit=c.powered && connected(i,d);
        if(lit){
          ctx.strokeStyle='rgba(255,194,75,0.85)';ctx.lineWidth=arm;
          ctx.shadowBlur=cell*0.18;ctx.shadowColor='rgba(255,194,75,0.5)';
        }else{
          ctx.strokeStyle=c.powered?'rgba(255,194,75,0.7)':'rgba(38,224,200,0.34)';
          ctx.lineWidth=arm*0.82;ctx.shadowBlur=0;
        }
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex,ey);ctx.stroke();
      }
      ctx.shadowBlur=0;ctx.restore();
    }

    // flowing current along powered+connected edges (E and S only to avoid dup)
    if(!reduce){
      for(let i=0;i<cells.length;i++){
        if(!cells[i].powered)continue;
        const cx=ox+(i%C)*cell+half, cy=oy+((i/C)|0)*cell+half;
        for(const d of [E,S]){
          if(!connected(i,d))continue;
          const nb=neighbor(i,d); if(!cells[nb].powered)continue;
          const nx=ox+(nb%C)*cell+half, ny=oy+((nb/C)|0)*cell+half;
          // flow from shallower depth to deeper
          let ax=cx,ay=cy,bx=nx,by=ny;
          if(cells[nb].depth<cells[i].depth){ax=nx;ay=ny;bx=cx;by=cy;}
          for(let k=0;k<2;k++){
            const ph=((t*0.0011)+k*0.5)%1;
            const px=ax+(bx-ax)*ph, py=ay+(by-ay)*ph;
            ctx.fillStyle='rgba(255,242,208,'+(0.85*(1-Math.abs(ph-0.5)*1.3))+')';
            ctx.beginPath();ctx.arc(px,py,arm*0.62,0,7);ctx.fill();
          }
        }
      }
    }

    // nodes: root, receptors, junctions
    for(let i=0;i<cells.length;i++){
      const c=cells[i]; if(c.mask===0)continue;
      const cx=ox+(i%C)*cell+half, cy=oy+((i/C)|0)*cell+half;
      if(c.isRoot){
        const pr=1+0.18*Math.sin(t*0.005);
        ctx.fillStyle='rgba(122,240,192,0.95)';ctx.shadowBlur=cell*0.3;ctx.shadowColor='rgba(122,240,192,0.8)';
        ctx.beginPath();ctx.arc(cx,cy,cell*0.16*pr,0,7);ctx.fill();ctx.shadowBlur=0;
      } else if(c.isReceptor){
        if(c.powered)c.bloom+=(1-c.bloom)*0.12; else c.bloom+=(0-c.bloom)*0.12;
        const lit=c.powered;
        ctx.fillStyle=lit?'rgba(255,242,208,0.95)':'rgba(38,224,200,0.5)';
        if(lit){ctx.shadowBlur=cell*0.22;ctx.shadowColor='rgba(255,194,75,0.7)';}
        ctx.beginPath();ctx.arc(cx,cy,cell*(0.07+0.07*c.bloom),0,7);ctx.fill();ctx.shadowBlur=0;
        // bloom petals when fed
        if(c.bloom>0.4){
          ctx.strokeStyle='rgba(255,194,75,'+(c.bloom*0.6)+')';ctx.lineWidth=1.4;
          for(let p=0;p<5;p++){const a=t*0.001+p*1.2566;
            ctx.beginPath();ctx.moveTo(cx,cy);
            ctx.lineTo(cx+Math.cos(a)*cell*0.14*c.bloom, cy+Math.sin(a)*cell*0.14*c.bloom);ctx.stroke();}
        }
      } else {
        ctx.fillStyle=c.powered?'rgba(255,194,75,0.85)':'rgba(38,224,200,0.4)';
        ctx.beginPath();ctx.arc(cx,cy,arm*0.7,0,7);ctx.fill();
      }
    }

    // win cascade ring
    if(won && winT<1100 && !reduce){
      const cx=ox+(root%C)*cell+half, cy=oy+((root/C)|0)*cell+half;
      const rad=winT*0.9;
      ctx.strokeStyle='rgba(255,242,208,'+(1-winT/1100)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.stroke();
    }

    ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }

  resize(); genLevel();
  requestAnimationFrame(frame);
  setTimeout(()=>document.getElementById('boot').classList.add('gone'),650);
})();
</script>
</body>
</html>
